<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrobby — crawl test</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
<style>
  body { padding: 1.4rem; }
  h3 { font-family: var(--font-display); margin: 1.4rem 0 .4rem; }

  /* Everything about Wrobby lives in app.css — this page only sizes him and
     varies the tempo so the cadence can be compared side by side. */
  .wrobby-track { padding: .5rem 0; }
  .row { display: flex; gap: 2rem; align-items: center; }
  .slow .wrobby { animation-duration: 2s; }
  .fast .wrobby { animation-duration: .5s; }
</style>
</head>
<body>
<button id="t">toggle theme</button>

<h3>crawling across, 4 fps</h3>
<div class="wrobby-track"><div class="wrobby-walk"><div class="wrobby-lurch"><div class="wrobby"></div></div></div></div>

<h3>cycle only, three speeds — 2 fps / 4 fps / 8 fps</h3>
<div class="row">
  <div class="slow"><div class="wrobby" style="--wrobby-w:190px"></div></div>
  <div><div class="wrobby" style="--wrobby-w:190px"></div></div>
  <div class="fast"><div class="wrobby" style="--wrobby-w:190px"></div></div>
</div>

<h3>sizes — 320 / 190 / 110 / 64</h3>
<div class="row">
  <div class="wrobby" style="--wrobby-w:320px"></div>
  <div class="wrobby" style="--wrobby-w:190px"></div>
  <div class="wrobby" style="--wrobby-w:110px"></div>
  <div class="wrobby" style="--wrobby-w:64px"></div>
</div>

<script>
document.getElementById('t').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'evening' ? 'day' : 'evening';
};
</script>
</body>
</html>
