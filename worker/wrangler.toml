name = "wrabble-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Every 15 minutes. Phase transitions are clock-driven, so this only needs to be
# fine-grained enough that "8pm Thursday" feels on time.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wrabble"
database_id = "2c956bda-a8a9-496b-8fc9-5eae6bb1d700"

[vars]
# Public config. Secrets (DISCORD_CLIENT_SECRET, SESSION_SECRET) go in via
# `wrangler secret put`, never here.
APP_BASE_URL = "https://acandelmo3.github.io/wrabble"
API_BASE_URL = "https://wrabble-api.acandelmo3.workers.dev"
ALLOWED_ORIGINS = "https://acandelmo3.github.io,http://localhost:5173"
DISCORD_CLIENT_ID = "1531870877778710578"
ALLOW_TIME_TRAVEL = "false"

# Bindings are NOT inherited by named environments — the dev env needs its own
# copy or `wrangler dev --env dev` starts with no database at all.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "wrabble"
database_id = "2c956bda-a8a9-496b-8fc9-5eae6bb1d700"

[env.dev.vars]
APP_BASE_URL = "http://localhost:5173"
API_BASE_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
DISCORD_CLIENT_ID = "1531870877778710578"
ALLOW_TIME_TRAVEL = "true"
